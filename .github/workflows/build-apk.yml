name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Standalone Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: 'https://irqspxluxuhktblzabez.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable_3YL2mPK14wuJXI5Bc6Qedg_iPpguzdQ'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Standalone Signed Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk ./NullPin.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk ./NullPin.apk
          else
            echo "Searching for built APK..."
            find android/app/build/outputs/apk -name "*.apk" -exec cp {} ./NullPin.apk \;
          fi
          ls -lh ./NullPin.apk

      - name: Upload APK to GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 'NullPin v1.0.0'
          files: NullPin.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update public/NullPin.apk and commit
        run: |
          cp NullPin.apk public/NullPin.apk
          git config --global user.name "wahab-usman"
          git config --global user.email "151013258+wahab-usman@users.noreply.github.com"
          git add public/NullPin.apk
          if git diff --staged --quiet; then
            echo "No changes to public/NullPin.apk"
          else
            git commit -m "chore(release): auto-update public/NullPin.apk with v1.0.2 release [skip ci]"
            git push origin main
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullPin-Android-APK
          path: NullPin.apk

